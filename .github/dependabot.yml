version: 2
updates:
  # Dev dependencies only: the published package has no runtime dependencies.
  # One grouped PR a week; validate gates each bump.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age before proposing it; hijacked versions are usually
    # caught and yanked within days (same idea as min-release-age in .npmrc).
    cooldown:
      default-days: 2
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # Compiler majors get a deliberate upgrade PR, not a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ["*"]
