name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR shares one group per branch, so a new push cancels its older run. Every
# push to main gets its own group: publish.yml needs a successful run on the
# exact commit being tagged, and a shared group would cancel it.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

      # What ships is what n8n verifies: no runtime dependencies, and only dist in the tarball.
      - name: Check the package contents
        run: |
          test "$(jq '.dependencies // {} | length' package.json)" = 0
          # npm 10 prints an array, npm 11+ an object keyed by package name.
          npm pack --dry-run --json | jq -e '(if type == "array" then .[0] else .[] end) | all(.files[]; .path | startswith("dist/") or . == "package.json" or . == "README.md" or . == "LICENSE.md" or . == "CHANGELOG.md")'
