name: publish

# A release is a deliberate act: push a `v<version>` tag that matches
# package.json, on a commit that is on main and already passed validate.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Nothing else publishes. Merges to main never do.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for trusted publishing, and npm provenance
  actions: read # look up the validate run for the tagged commit

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main-ancestry check needs history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag, main, validate, and npm
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          OK="$(gh run list -R "$GITHUB_REPOSITORY" --workflow validate --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq 'length')"
          if [ "$OK" = "0" ]; then
            echo "::error::no successful validate run on main for $GITHUB_SHA; wait for it (or fix it) and re-push the tag"
            exit 1
          fi
          # The GitHub release is created after npm publish, from this section;
          # extract it now so a missing or empty one fails before anything is published.
          awk -v v="$VERSION" 'index($0, "## [") == 1 { on = (index($0, "## [" v "]") == 1); next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # Entries are list items, as in aiand-cli: a section with only headings is empty.
          if ! grep -q '^- ' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entries under [$VERSION]; add them and re-push the tag"
            exit 1
          fi
          # Only npm's E404 means "not published"; any other lookup failure stops
          # the run rather than publishing on an inconclusive answer.
          if PUBLISHED="$(npm view "$NAME@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err")"; then
            # npm is published but the GitHub release is not: an earlier run failed
            # after publishing. Re-running recovers the release without publishing again.
            if [ -n "$PUBLISHED" ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$NAME@$VERSION and release $TAG already exist; bump package.json and tag the new version"
              exit 1
            fi
            if [ -n "$PUBLISHED" ]; then
              # A release must describe the source the npm artifact was built from, and npm
              # never lets a version be republished to fix a mismatch. So recover only when
              # the artifact's provenance names this repository and this exact commit.
              ATTESTATIONS="$(curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/${NAME/\//%2f}@$VERSION")" || {
                echo "::error::$NAME@$VERSION is on npm without readable provenance; cannot tie it to $GITHUB_SHA"
                exit 1
              }
              PROVENANCE="$(jq -r '.attestations[] | select(.predicateType | startswith("https://slsa.dev/provenance/")) | .bundle.dsseEnvelope.payload' <<<"$ATTESTATIONS" | base64 -d)"
              BUILT_FROM="$(jq -r '.predicate.buildDefinition | "\(.externalParameters.workflow.repository) \(.resolvedDependencies[0].digest.gitCommit)"' <<<"$PROVENANCE")"
              if [ "$BUILT_FROM" != "https://github.com/$GITHUB_REPOSITORY $GITHUB_SHA" ]; then
                echo "::error::$NAME@$VERSION was built from $BUILT_FROM, not $GITHUB_SHA; not creating a release for it"
                exit 1
              fi
              echo "::notice::$NAME@$VERSION is already on npm from this commit; creating only the missing GitHub release"
              echo "SKIP_NPM_PUBLISH=true" >> "$GITHUB_ENV"
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err" >&2
            echo "::error::could not check whether $NAME@$VERSION is on npm"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Node 22 bundles npm 10, which has no OIDC support: a trusted-publishing
      # publish falls back to an empty token and the registry answers with a
      # misleading 404. Trusted publishing needs npm 11.5.1 or newer. Pinned
      # because this binary handles NODE_AUTH_TOKEN; bump it deliberately.
      - name: Install an npm that speaks OIDC
        run: npm install -g npm@11.20.0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      # With a trusted publisher configured for this repository and workflow
      # filename, npm authenticates over OIDC and NPM_TOKEN goes unused; the
      # secret can then be deleted without touching this file.
      # RELEASE_MODE satisfies n8n-node's prepublishOnly guard, which otherwise
      # refuses a plain npm publish.
      - if: env.SKIP_NPM_PUBLISH != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: "true"
      # Release notes are the version's CHANGELOG section, not generated ones.
      - run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
